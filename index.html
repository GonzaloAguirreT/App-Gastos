<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover es lo que deja usar env(safe-area-inset-*): sin él el
     móvil reserva las franjas del sistema por su cuenta y la barra de pestañas
     queda flotando sobre una banda de color que no es la nuestra. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Lo actualiza VISTA.aplicarTema al arrancar; este valor es el del papel,
     que es el tema que ve quien no ha elegido nada con el móvil en claro. -->
<meta name="theme-color" content="#F4F0E8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Gastos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="iconos/icono-192.png">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div class="app">

  <!-- Arriba solo aire: el sistema ya pinta la hora y las pestañas ya dicen
       dónde estás. -->
  <div class="aire"></div>

  <!-- Cada pantalla la pinta entera su módulo. El HTML solo reserva el hueco:
       así no hay dos sitios (aquí y en el JS) donde pueda estar la verdad. -->
  <section class="pantalla activa" id="pantalla-mes"></section>
  <section class="pantalla" id="pantalla-historial"></section>
  <section class="pantalla" id="pantalla-detalle"></section>
  <section class="pantalla" id="pantalla-fijos"></section>
  <section class="pantalla" id="pantalla-fijo"></section>
  <section class="pantalla" id="pantalla-ahorro"></section>
  <section class="pantalla" id="pantalla-reparto"></section>
  <section class="pantalla" id="pantalla-anotar"></section>
  <section class="pantalla" id="pantalla-ajustes"></section>
  <section class="pantalla" id="pantalla-categorias"></section>
  <section class="pantalla" id="pantalla-cuentas"></section>
  <section class="pantalla" id="pantalla-atajo"></section>
  <section class="pantalla" id="pantalla-conectar"></section>
  <section class="pantalla" id="pantalla-quienes"></section>
  <section class="pantalla" id="pantalla-detectados"></section>

  <!-- Barra de deshacer. No es un aviso flotante: ocupa el ancho entero
       encima de las pestañas, porque borrar no pide confirmación. -->
  <div class="deshacer" id="deshacer" hidden>
    <span class="deshacer-texto" id="deshacer-texto"></span>
    <button type="button" class="deshacer-boton" id="deshacer-boton">Deshacer</button>
  </div>

  <nav class="tabs" id="tabs">
    <div class="tabs-lista">
      <button type="button" class="tab activo" data-tab="mes">Mes</button>
      <button type="button" class="tab" data-tab="historial">Historial</button>
      <button type="button" class="tab" data-tab="fijos">Fijos</button>
      <button type="button" class="tab" data-tab="ahorro">Ahorro</button>
      <button type="button" class="tab" data-tab="ajustes">Ajustes</button>
    </div>
    <button type="button" class="tab-anotar" id="btn-anotar">Anotar</button>
  </nav>

</div>

<!-- Se enseña solo si el HTML y el JS son de versiones distintas. Ver app.js. -->
<div id="averia" hidden></div>

<!-- Sin empaquetador: el orden es el de las dependencias. config y formato no
     dependen de nada; nucleo necesita config; estado necesita los tres; las
     pantallas necesitan estado y vista; app.js las enciende a todas. -->
<script src="config.js"></script>
<script src="js/formato.js"></script>
<script src="js/nucleo.js"></script>
<script src="js/vista.js"></script>
<script src="js/estado.js"></script>
<script src="js/mes.js"></script>
<script src="js/fijos.js"></script>
<script src="js/ahorro.js"></script>
<script src="js/anotar.js"></script>
<script src="js/ajustes.js"></script>
<script src="js/app.js"></script>

</body>
</html>
