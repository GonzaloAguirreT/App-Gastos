<!-- Icono de la app: tres barras ascendentes recortadas sobre un campo coral.
     El campo va en color y las barras en oscuro, y no al revés: un icono casi
     negro sobre un fondo de pantalla oscuro desaparece entre los demás y hay
     que buscarlo. Con el campo de color se localiza de un vistazo.
     Sin degradados ni detalle fino a propósito: a 48px en la pantalla de inicio
     no se distingue nada más que la silueta.
     Para la versión "maskable" de Android hay un archivo aparte que genera
     generar-iconos.py, con el fondo a sangre y las barras encogidas al 80%. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" ry="112" fill="#FF8A5B"/>
  <g fill="#14100E">
    <rect x="112" y="272" width="72" height="128" rx="26" ry="26"/>
    <rect x="220" y="192" width="72" height="208" rx="26" ry="26"/>
    <rect x="328" y="96"  width="72" height="304" rx="26" ry="26"/>
  </g>
</svg>
