<!-- Icono de la app: tres barras ascendentes sobre fondo oscuro.
     Sin degradados ni detalle fino a propósito: a 48px en la pantalla de inicio
     de Android no se distingue nada más que la silueta.
     Las barras quedan dentro del 60% central para que el recorte circular de
     los iconos "maskable" de Android no se coma nada. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" ry="112" fill="#0E1013"/>
  <g fill="#4ADE80">
    <rect x="152" y="276" width="56" height="96"  rx="20" ry="20"/>
    <rect x="228" y="212" width="56" height="160" rx="20" ry="20"/>
    <rect x="304" y="140" width="56" height="232" rx="20" ry="20"/>
  </g>
</svg>
